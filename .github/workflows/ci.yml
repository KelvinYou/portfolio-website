name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — no point burning
# minutes on a commit nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # --max-warnings is deliberately not set to 0 yet: there is a backlog of
      # prettier formatting warnings. Errors fail the build; warnings are
      # visible but non-blocking. Tighten this once the backlog is cleared.
      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
